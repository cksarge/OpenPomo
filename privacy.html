<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Privacy Policy — OpenPomo</title>
    <meta name="description" content="OpenPomo's privacy policy: what data it collects (none) and how it works." />
    <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="assets/style.css" />
    <script src="assets/theme.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/lib/marked.umd.min.js"></script>
  </head>
  <body>
    <nav class="site-nav">
      <div class="container nav-inner">
        <a href="index.html" class="brand">
          <img src="assets/logo.svg" alt="" />
          OpenPomo
        </a>
        <div class="nav-links">
          <a href="index.html#features">Features</a>
          <a href="index.html#how-it-works">How it works</a>
          <a href="privacy.html">Privacy</a>
          <a href="https://github.com/cksarge/OpenPomo" target="_blank" rel="noopener">GitHub</a>
          <a href="https://buymeacoffee.com/cksarge" target="_blank" rel="noopener">Buy me a coffee</a>
          <button id="theme-toggle-btn" class="icon-btn" title="Toggle theme" aria-label="Toggle theme"></button>
          <!-- TODO: replace with the Chrome Web Store listing URL once published -->
          <a href="#" class="btn btn-primary">Add to Chrome</a>
        </div>
      </div>
    </nav>

    <main class="policy-page container">
      <div class="policy-card">
        <div id="policy-content">
          <p class="policy-loading">Loading privacy policy…</p>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="container footer-inner">
        <span>© 2026 OpenPomo. MIT licensed.</span>
        <div class="footer-links">
          <a href="privacy.html">Privacy Policy</a>
          <a href="https://github.com/cksarge/OpenPomo" target="_blank" rel="noopener">GitHub</a>
        </div>
      </div>
    </footer>

    <script>
      const contentEl = document.getElementById("policy-content");
      fetch("privacy-policy.md")
        .then((res) => {
          if (!res.ok) throw new Error("Failed to load privacy-policy.md");
          return res.text();
        })
        .then((markdown) => {
          contentEl.innerHTML = marked.parse(markdown);
        })
        .catch(() => {
          contentEl.innerHTML =
            '<p class="policy-error">Couldn\'t load the privacy policy. If you\'re viewing this file directly ' +
            "from disk, serve the <code>website/</code> folder over http(s) instead (e.g. " +
            "<code>python3 -m http.server</code>) — browsers block local file fetches.</p>";
        });
    </script>
  </body>
</html>
