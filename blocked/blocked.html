<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Blocked — OpenTomato</title>
    <link rel="stylesheet" href="blocked.css" />
  </head>
  <body>
    <div class="page">
      <div class="topbar">
        <button id="theme-toggle-btn" class="icon-btn" title="Toggle theme" aria-label="Toggle theme"></button>
      </div>
      <main class="card" id="card">
        <div class="icon" aria-hidden="true">⛔</div>
        <h1 id="headline">You can't go there!</h1>
        <p id="message">This site is off-limits while you're focusing.</p>
        <div class="time-remaining" id="time-remaining">
          <span class="label">Time remaining</span>
          <span class="value" id="time-value">25:00</span>
        </div>
        <p class="hint">Head back to what you were working on — you've got this.</p>
      </main>
    </div>
    <script type="module" src="blocked.js"></script>
  </body>
</html>
